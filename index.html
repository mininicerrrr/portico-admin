<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portico Admin — 基于 portico-ui 的示例管理后台" />
    <title>Portico Admin</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portico-admin-theme')
          if (stored === 'dark') {
            document.documentElement.classList.add('pt-dark')
            document.documentElement.setAttribute('data-pt-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
